[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# POST-TEMPLATE is scaffolding, not content. Keep it out of search results.
[[headers]]
  for = "/blog/POST-TEMPLATE.html"
  [headers.values]
    X-Robots-Tag = "noindex"
